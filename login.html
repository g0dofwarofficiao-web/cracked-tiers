<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Login | Cracked Tiers</title>

<link rel="stylesheet" href="style.css">

</head><body><!-- Navigation -->
<header class="navbar">

    <a href="index.html" class="brand">
        <span class="brand-icon">⚔</span>
        <span>CRACKED TIERS</span>
    </a>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="rankings.html">Rankings</a>
    </nav>

</header>


<main class="admin-login-page">

    <section class="admin-login-card">

        <p class="eyebrow">
            STAFF ACCESS
        </p>

        <h1>
            ADMIN LOGIN
        </h1>

        <p class="admin-login-text">
            Sign in to manage Cracked Tiers rankings.
        </p>


        <form id="loginForm">

            <div class="admin-form-group">

                <label for="adminEmail">
                    EMAIL
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="admin-form-group">

                <label for="adminPassword">
                    PASSWORD
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-button admin-login-button"
            >
                SIGN IN
            </button>


            <div
                id="loginMessage"
                class="admin-message"
            ></div>

        </form>

    </section>

</main>


<footer>

    <div class="brand">
        <span class="brand-icon">⚔</span>
        <span>CRACKED TIERS</span>
    </div>

    <p>
        Cracked Tiers Administration
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
