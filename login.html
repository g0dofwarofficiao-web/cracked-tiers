<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Login | Cracked Tiers</title>

<link rel="stylesheet" href="style.css">

</head><body><!-- Navigation -->
<header class="navbar">

    <a href="index.html" class="brand">
        <span class="brand-icon">⚔</span>
        <span>CRACKED TIERS</span>
    </a>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="rankings.html">Rankings</a>
    </nav>

</header>


<main class="admin-login-page">

    <section class="admin-login-card">

        <p class="eyebrow">
            STAFF ACCESS
        </p>

        <h1>
            ADMIN LOGIN
        </h1>

        <p class="admin-login-text">
            Sign in to manage Cracked Tiers rankings.
        </p>


        <form id="loginForm">

            <div class="admin-form-group">

                <label for="adminEmail">
                    EMAIL
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="admin-form-group">

                <label for="adminPassword">
                    PASSWORD
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-button admin-login-button"
                id="loginButton"
            >
                SIGN IN
            </button>


            <div
                id="loginMessage"
                class="admin-message"
            ></div>

        </form>

    </section>

</main>


<footer>

    <div class="brand">
        <span class="brand-icon">⚔</span>
        <span>CRACKED TIERS</span>
    </div>

    <p>
        Cracked Tiers Administration
    </p>

</footer>


<script>

    const SUPABASE_URL =
        "https://twgnubacplneragssrot.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_O4hAWDj8dTdSsHTL6j9nrg_SEOZIQiR";

    const ADMIN_USER_ID =
        "ca1c160b-d6c8-4544-b12d-2777d39879d4";


    const loginForm =
        document.getElementById("loginForm");

    const loginMessage =
        document.getElementById("loginMessage");

    const loginButton =
        document.getElementById("loginButton");


    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("adminEmail")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("adminPassword")
                    .value;


            loginMessage.textContent =
                "Signing in...";

            loginButton.disabled = true;


            try {

                const response =
                    await fetch(
                        SUPABASE_URL +
                        "/auth/v1/token?grant_type=password",
                        {
                            method: "POST",

                            headers: {
                                "apikey":
                                    SUPABASE_KEY,

                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                const authData =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        authData.error_description ||
                        authData.msg ||
                        "Unable to sign in"
                    );
                }


                if (
                    !authData.user ||
                    authData.user.id !==
                    ADMIN_USER_ID
                ) {

                    loginMessage.textContent =
                        "This account does not have admin access.";

                    loginButton.disabled =
                        false;

                    return;
                }


                localStorage.setItem(
                    "crackedTiersSession",
                    JSON.stringify(authData)
                );


                loginMessage.textContent =
                    "Login successful!";


                window.location.href =
                    "admin.html";


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                loginMessage.textContent =
                    error.message;


                loginButton.disabled =
                    false;
            }
        }
    );

</script>

</body>
</html>
